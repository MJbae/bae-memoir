<script>
(() => {
  const root = document.getElementById('memoir-reader-comparison');
  if (!root) return;
  const saved = window.openai?.widgetState;
  const state = { width:390, reading:20 };
  function restore(value) {
    const settings = value?.privateContent;
    if (Number.isFinite(settings?.width)) state.width = Math.min(430, Math.max(280, settings.width));
    if (Number.isFinite(settings?.reading)) state.reading = Math.min(26, Math.max(18, settings.reading));
  }
  function render() {
    root.style.setProperty('--memoir-width', `${state.width}px`);
    root.style.setProperty('--memoir-reading', `${state.reading}px`);
  }
  function persist() {
    if (window.openai?.setWidgetState) window.openai.setWidgetState({ modelContent:{preview:'회차 하단 개선안',width:state.width,reading:state.reading}, privateContent:{...state} }).catch(() => {});
  }
  restore(saved); render();
  window.addEventListener('openai:set_globals', event => { restore(event.detail?.globals?.widgetState); render(); });
  root.querySelectorAll('.memoir-phone').forEach(phone => {
    const status = phone.querySelector('.memoir-status');
    phone.querySelectorAll('[data-reaction]').forEach(button => {
      button.addEventListener('click', () => {
        const already = button.getAttribute('aria-pressed') === 'true';
        phone.querySelectorAll('[data-reaction]').forEach(peer => peer.setAttribute('aria-pressed','false'));
        button.setAttribute('aria-pressed',String(!already));
        status.textContent = already ? '반응을 취소했어요. (미리보기)' : `${button.dataset.reaction} · 선택했어요. (미리보기)`;
      });
    });
    phone.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => {
      const action = button.dataset.action;
      if (action === 'compose') { const form = phone.querySelector('.memoir-form'); form.hidden = !form.hidden; if (!form.hidden) form.querySelector('input').focus(); }
      else if (action === 'settings') { state.reading = state.reading === 20 ? 26 : 20; render(); persist(); status.textContent = `본문 ${state.reading}px · 미리보기`; }
      else status.textContent = action === 'list' ? '회차 목록으로 이동하는 버튼입니다. (미리보기)' : '1화로 이동하는 버튼입니다. (미리보기)';
    }));
  });
  if (globalThis.Tweak) {
    const tweak = new globalThis.Tweak({ container:root, onChange:() => { render(); persist(); } });
    tweak.addSlider(state,'width',{label:'휴대폰 화면 너비',min:280,max:430,step:10,unit:'px'});
    tweak.addSlider(state,'reading',{label:'본문 글자 크기',min:18,max:26,step:1,unit:'px'});
  }
})();
</script>
